<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="break-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110524"/>
      <stop offset="50%" stop-color="#21083f"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>
    <filter id="brick-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#break-bg)"/>

  <!-- Rows of colored bricks -->
  <!-- Red row -->
  <g fill="#ef4444">
    <rect x="40" y="50" width="60" height="18" rx="3"/>
    <rect x="105" y="50" width="60" height="18" rx="3"/>
    <rect x="170" y="50" width="60" height="18" rx="3"/>
    <rect x="235" y="50" width="60" height="18" rx="3"/>
    <rect x="300" y="50" width="60" height="18" rx="3"/>
    <rect x="365" y="50" width="60" height="18" rx="3"/>
    <rect x="430" y="50" width="60" height="18" rx="3"/>
    <rect x="495" y="50" width="60" height="18" rx="3"/>
  </g>
  <!-- Orange row with gap where ball shattered -->
  <g fill="#f97316">
    <rect x="40" y="74" width="60" height="18" rx="3"/>
    <rect x="105" y="74" width="60" height="18" rx="3"/>
    <rect x="170" y="74" width="60" height="18" rx="3"/>
    <!-- shattered gap at 235 & 300 -->
    <rect x="365" y="74" width="60" height="18" rx="3"/>
    <rect x="430" y="74" width="60" height="18" rx="3"/>
    <rect x="495" y="74" width="60" height="18" rx="3"/>
  </g>
  <!-- Yellow row -->
  <g fill="#eab308">
    <rect x="40" y="98" width="60" height="18" rx="3"/>
    <rect x="105" y="98" width="60" height="18" rx="3"/>
    <rect x="170" y="98" width="60" height="18" rx="3"/>
    <rect x="365" y="98" width="60" height="18" rx="3"/>
    <rect x="430" y="98" width="60" height="18" rx="3"/>
    <rect x="495" y="98" width="60" height="18" rx="3"/>
  </g>
  <!-- Green row -->
  <g fill="#22c55e">
    <rect x="40" y="122" width="60" height="18" rx="3"/>
    <rect x="105" y="122" width="60" height="18" rx="3"/>
    <rect x="170" y="122" width="60" height="18" rx="3"/>
    <rect x="235" y="122" width="60" height="18" rx="3"/>
    <rect x="300" y="122" width="60" height="18" rx="3"/>
    <rect x="365" y="122" width="60" height="18" rx="3"/>
    <rect x="430" y="122" width="60" height="18" rx="3"/>
    <rect x="495" y="122" width="60" height="18" rx="3"/>
  </g>
  <!-- Blue row -->
  <g fill="#00f5ff">
    <rect x="40" y="146" width="60" height="18" rx="3"/>
    <rect x="105" y="146" width="60" height="18" rx="3"/>
    <rect x="170" y="146" width="60" height="18" rx="3"/>
    <rect x="235" y="146" width="60" height="18" rx="3"/>
    <rect x="300" y="146" width="60" height="18" rx="3"/>
    <rect x="365" y="146" width="60" height="18" rx="3"/>
    <rect x="430" y="146" width="60" height="18" rx="3"/>
    <rect x="495" y="146" width="60" height="18" rx="3"/>
  </g>

  <!-- Brick explosion particles -->
  <g fill="#facc15" filter="url(#brick-glow)">
    <circle cx="260" cy="85" r="4"/>
    <circle cx="280" cy="70" r="3"/>
    <circle cx="270" cy="95" r="3.5"/>
    <circle cx="295" cy="80" r="4.5"/>
    <circle cx="310" cy="90" r="3"/>
  </g>

  <!-- Glowing Ball with Motion Trail -->
  <path d="M 285 85 L 230 200 L 290 310" stroke="#00f5ff" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
  <circle cx="285" cy="85" r="9" fill="#fff" filter="url(#brick-glow)"/>

  <!-- Player Paddle at bottom -->
  <g filter="url(#brick-glow)">
    <rect x="230" y="320" width="140" height="18" rx="8" fill="#00f5ff" stroke="#fff" stroke-width="2"/>
    <rect x="285" y="323" width="30" height="12" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0b0318" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#brick-glow)">QUEBRA-BLOCOS (BREAKOUT)</text>
</svg>
