<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ralph-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="50%" stop-color="#230d3d"/>
      <stop offset="100%" stop-color="#0f0521"/>
    </linearGradient>
    <filter id="ralph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#ralph-bg)"/>

  <!-- Niceland Building Brick Facade in Center -->
  <rect x="150" y="40" width="300" height="320" fill="#991b1b" stroke="#f87171" stroke-width="3"/>
  <!-- Windows Grid -->
  <!-- Top row: broken windows -->
  <rect x="180" y="80" width="60" height="70" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <path d="M180 80 L240 150 M240 80 L180 150" stroke="#000" stroke-width="2"/> <!-- Cracked glass -->

  <rect x="270" y="80" width="60" height="70" fill="#0f172a" stroke="#fff" stroke-width="2"/>
  <circle cx="300" cy="115" r="16" fill="#f97316"/> <!-- Pie inside -->

  <rect x="360" y="80" width="60" height="70" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <path d="M360 80 L420 150" stroke="#000" stroke-width="2"/>

  <!-- Middle row -->
  <rect x="180" y="180" width="60" height="70" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <rect x="270" y="180" width="60" height="70" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <rect x="360" y="180" width="60" height="70" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

  <!-- Ralph on roof throwing bricks -->
  <g transform="translate(230, 20)">
    <rect x="30" y="0" width="80" height="40" rx="8" fill="#7c2d12"/>
    <!-- Big Fists -->
    <circle cx="15" cy="30" r="18" fill="#ea580c"/>
    <circle cx="125" cy="30" r="18" fill="#ea580c"/>
    <text x="70" y="25" fill="#fef08a" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">RALPH</text>
  </g>

  <!-- Felix Jr. with Golden Magic Hammer -->
  <g transform="translate(260, 240)" filter="url(#ralph-glow)">
    <!-- Blue Cap -->
    <rect x="20" y="0" width="40" height="18" rx="6" fill="#2563eb"/>
    <text x="40" y="14" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">FF</text>
    <!-- Face -->
    <circle cx="40" cy="26" r="12" fill="#fed7aa"/>
    <!-- Blue Overalls -->
    <rect x="25" y="38" width="30" height="35" rx="4" fill="#1d4ed8"/>
    <!-- Golden Hammer raised -->
    <rect x="62" y="10" width="10" height="28" fill="#a16207"/>
    <rect x="52" y="4" width="30" height="14" rx="3" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
  </g>

  <!-- Falling Bricks -->
  <g fill="#ea580c" stroke="#7c2d12" stroke-width="1.5">
    <rect x="190" y="140" width="28" height="16" rx="2" transform="rotate(15 190 140)"/>
    <rect x="380" y="130" width="28" height="16" rx="2" transform="rotate(-20 380 130)"/>
  </g>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0d041c" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#ralph-glow)">DETONA RALPH (FIX-IT FELIX)</text>
</svg>
