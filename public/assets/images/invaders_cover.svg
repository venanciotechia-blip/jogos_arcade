<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="invaders-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090117"/>
      <stop offset="60%" stop-color="#180733"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <filter id="laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#invaders-bg)"/>

  <!-- Starfield -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="120" cy="90" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="30" r="2" fill="#00f5ff" opacity="0.9"/>
  <circle cx="340" cy="70" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="480" cy="45" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="560" cy="80" r="2" fill="#e879f9" opacity="0.8"/>
  <circle cx="80" cy="180" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="520" cy="220" r="1.5" fill="#00f5ff" opacity="0.8"/>

  <!-- Alien Fleet Row 1 (Octopus) in Neon Pink -->
  <g fill="#ec4899" filter="url(#laser-glow)">
    <!-- Alien 1 -->
    <path d="M120 70 h20 v5 h-20 z M115 75 h30 v10 h-30 z M110 85 h40 v5 h-40 z M110 90 h10 v10 h-10 z M140 90 h10 v10 h-10 z M120 90 h20 v5 h-20 z"/>
    <!-- Alien 2 -->
    <path d="M210 70 h20 v5 h-20 z M205 75 h30 v10 h-30 z M200 85 h40 v5 h-40 z M200 90 h10 v10 h-10 z M230 90 h10 v10 h-10 z M210 90 h20 v5 h-20 z"/>
    <!-- Alien 3 -->
    <path d="M300 70 h20 v5 h-20 z M295 75 h30 v10 h-30 z M290 85 h40 v5 h-40 z M290 90 h10 v10 h-10 z M320 90 h10 v10 h-10 z M300 90 h20 v5 h-20 z"/>
    <!-- Alien 4 -->
    <path d="M390 70 h20 v5 h-20 z M385 75 h30 v10 h-30 z M380 85 h40 v5 h-40 z M380 90 h10 v10 h-10 z M410 90 h10 v10 h-10 z M390 90 h20 v5 h-20 z"/>
    <!-- Alien 5 -->
    <path d="M480 70 h20 v5 h-20 z M475 75 h30 v10 h-30 z M470 85 h40 v5 h-40 z M470 90 h10 v10 h-10 z M500 90 h10 v10 h-10 z M480 90 h20 v5 h-20 z"/>
  </g>

  <!-- Alien Fleet Row 2 (Crab) in Neon Cyan -->
  <g fill="#00f5ff" filter="url(#laser-glow)">
    <path d="M110 120 h40 v10 h-40 z M105 130 h50 v10 h-50 z M115 140 h30 v5 h-30 z M105 145 h10 v5 h-10 z M145 145 h10 v5 h-10 z"/>
    <path d="M200 120 h40 v10 h-40 z M195 130 h50 v10 h-50 z M205 140 h30 v5 h-30 z M195 145 h10 v5 h-10 z M235 145 h10 v5 h-10 z"/>
    <path d="M290 120 h40 v10 h-40 z M285 130 h50 v10 h-50 z M295 140 h30 v5 h-30 z M285 145 h10 v5 h-10 z M325 145 h10 v5 h-10 z"/>
    <path d="M380 120 h40 v10 h-40 z M375 130 h50 v10 h-50 z M385 140 h30 v5 h-30 z M375 145 h10 v5 h-10 z M415 145 h10 v5 h-10 z"/>
    <path d="M470 120 h40 v10 h-40 z M465 130 h50 v10 h-50 z M475 140 h30 v5 h-30 z M465 145 h10 v5 h-10 z M505 145 h10 v5 h-10 z"/>
  </g>

  <!-- Red Mothership UFO at Top -->
  <g fill="#ef4444" filter="url(#laser-glow)">
    <path d="M250 30 h100 v8 h-100 z M230 38 h140 v10 h-140 z M260 48 h80 v5 h-80 z"/>
    <circle cx="270" cy="43" r="3" fill="#fef08a"/>
    <circle cx="300" cy="43" r="3" fill="#fef08a"/>
    <circle cx="330" cy="43" r="3" fill="#fef08a"/>
  </g>

  <!-- Falling alien laser bombs -->
  <line x1="220" y1="165" x2="220" y2="210" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8,6" filter="url(#laser-glow)"/>
  <line x1="400" y1="165" x2="400" y2="230" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8,6" filter="url(#laser-glow)"/>

  <!-- Green Defender Cannon Shooting -->
  <g fill="#22c55e" filter="url(#laser-glow)">
    <path d="M285 305 h30 v8 h-30 z M290 295 h20 v10 h-20 z M297 285 h6 v10 h-6 z"/>
  </g>
  <!-- Player laser blast traveling up -->
  <line x1="300" y1="280" x2="300" y2="160" stroke="#00f5ff" stroke-width="4" filter="url(#laser-glow)"/>

  <!-- Defensive Bunkers -->
  <path d="M120 280 h50 v20 h-12 v-10 h-26 v10 h-12 z" fill="#10b981" opacity="0.85"/>
  <path d="M430 280 h50 v20 h-12 v-10 h-26 v10 h-12 z" fill="#10b981" opacity="0.85"/>

  <!-- Ground line -->
  <line x1="0" y1="330" x2="600" y2="330" stroke="#00f5ff" stroke-width="2" filter="url(#laser-glow)"/>

  <!-- Title banner -->
  <rect x="0" y="375" width="600" height="75" fill="#0c0418" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#laser-glow)">INVASORES ESPACIAIS</text>
</svg>
