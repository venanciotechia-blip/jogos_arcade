<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mine-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140728"/>
      <stop offset="50%" stop-color="#210d3e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <filter id="mine-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#mine-bg)"/>

  <!-- Vintage grey/neon 3D grid -->
  <!-- Top digital timer / mine counter header -->
  <rect x="80" y="30" width="440" height="50" rx="8" fill="#180c30" stroke="#7e22ce" stroke-width="2"/>
  <rect x="95" y="38" width="70" height="34" rx="4" fill="#000"/>
  <text x="130" y="63" fill="#ef4444" font-family="monospace" font-size="24" font-weight="900" text-anchor="middle">010</text>

  <!-- Cool smiley face button in center -->
  <circle cx="300" cy="55" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <!-- Sunglasses smiley -->
  <path d="M288 52 h10 v4 h-10 z M302 52 h10 v4 h-10 z" fill="#000"/>
  <path d="M292 63 Q300 70 308 63" stroke="#000" stroke-width="2" fill="none"/>

  <rect x="435" y="38" width="70" height="34" rx="4" fill="#000"/>
  <text x="470" y="63" fill="#ef4444" font-family="monospace" font-size="24" font-weight="900" text-anchor="middle">099</text>

  <!-- Board Tiles in 3D Isometric / Retro Perspective -->
  <!-- Row 1 -->
  <g font-family="monospace" font-weight="900" font-size="26" text-anchor="middle">
    <!-- Unopened cell -->
    <rect x="130" y="100" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
    <!-- Cell with number 1 (Blue) -->
    <rect x="200" y="100" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="230" y="142" fill="#00f5ff" filter="url(#mine-glow)">1</text>
    <!-- Cell with number 2 (Green) -->
    <rect x="270" y="100" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="300" y="142" fill="#22c55e">2</text>
    <!-- Flagged cell -->
    <rect x="340" y="100" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
    <polygon points="360,118 385,128 360,138" fill="#ef4444" filter="url(#mine-glow)"/>
    <line x1="360" y1="116" x2="360" y2="150" stroke="#fff" stroke-width="3"/>
    <!-- Unopened -->
    <rect x="410" y="100" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
  </g>

  <!-- Row 2 -->
  <g font-family="monospace" font-weight="900" font-size="26" text-anchor="middle">
    <rect x="130" y="170" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="160" y="212" fill="#00f5ff">1</text>
    <!-- Naval Mine revealed in center tile! -->
    <rect x="200" y="170" width="60" height="60" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="230" cy="200" r="16" fill="#000"/>
    <line x1="210" y1="200" x2="250" y2="200" stroke="#000" stroke-width="4"/>
    <line x1="230" y1="180" x2="230" y2="220" stroke="#000" stroke-width="4"/>
    <circle cx="225" cy="195" r="4" fill="#fff"/>

    <rect x="270" y="170" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="300" y="212" fill="#ef4444">3</text>

    <rect x="340" y="170" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="370" y="212" fill="#22c55e">2</text>

    <rect x="410" y="170" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="440" y="212" fill="#00f5ff">1</text>
  </g>

  <!-- Row 3 -->
  <g font-family="monospace" font-weight="900" font-size="26" text-anchor="middle">
    <rect x="130" y="240" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
    <rect x="200" y="240" width="60" height="60" rx="6" fill="#1c0b33" stroke="#4c1d95" stroke-width="2"/>
    <text x="230" y="282" fill="#22c55e">2</text>
    <rect x="270" y="240" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
    <polygon points="290,258 315,268 290,278" fill="#ef4444" filter="url(#mine-glow)"/>
    <line x1="290" y1="256" x2="290" y2="290" stroke="#fff" stroke-width="3"/>
    <rect x="340" y="240" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
    <rect x="410" y="240" width="60" height="60" rx="6" fill="#381b5c" stroke="#6b21a8" stroke-width="2"/>
  </g>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0c0418" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#mine-glow)">CAMPO MINADO (MINESWEEPER)</text>
</svg>
