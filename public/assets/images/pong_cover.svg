<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pong-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010a"/>
      <stop offset="50%" stop-color="#140624"/>
      <stop offset="100%" stop-color="#020005"/>
    </linearGradient>
    <filter id="pong-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#pong-bg)"/>

  <!-- CRT scanlines simulation -->
  <line x1="300" y1="20" x2="300" y2="350" stroke="#7e22ce" stroke-width="6" stroke-dasharray="16,14"/>

  <!-- Scores in vintage 7-segment / pixel font -->
  <text x="210" y="90" fill="#00f5ff" font-family="monospace" font-size="64" font-weight="900" filter="url(#pong-glow)">03</text>
  <text x="340" y="90" fill="#e879f9" font-family="monospace" font-size="64" font-weight="900" filter="url(#pong-glow)">02</text>

  <!-- Player 1 Paddle (Cyan Neon) -->
  <rect x="50" y="160" width="18" height="90" rx="4" fill="#00f5ff" stroke="#e0f2fe" stroke-width="2" filter="url(#pong-glow)"/>

  <!-- Player 2 Paddle (Magenta/Pink Neon) -->
  <rect x="532" y="120" width="18" height="90" rx="4" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2" filter="url(#pong-glow)"/>

  <!-- Ball Motion Streak -->
  <path d="M 68 200 L 220 230 L 390 170" stroke="#00f5ff" stroke-width="4" stroke-dasharray="8,6" fill="none" opacity="0.6"/>
  <!-- Glowing Square Ball -->
  <rect x="385" y="162" width="18" height="18" rx="2" fill="#fff" filter="url(#pong-glow)"/>

  <!-- Court borders -->
  <rect x="30" y="20" width="540" height="340" fill="none" stroke="#6b21a8" stroke-width="4" rx="10"/>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0c0418" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#pong-glow)">TÊNIS RETRÔ (PONG 1972)</text>
</svg>
