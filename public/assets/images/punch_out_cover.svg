<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ring-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180424"/>
      <stop offset="60%" stop-color="#3b0724"/>
      <stop offset="100%" stop-color="#0a0312"/>
    </linearGradient>
    <filter id="punch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#ring-bg)"/>

  <!-- Boxing Ring Ropes -->
  <line x1="0" y1="140" x2="600" y2="140" stroke="#ef4444" stroke-width="6"/>
  <line x1="0" y1="180" x2="600" y2="180" stroke="#3b82f6" stroke-width="6"/>
  <line x1="0" y1="220" x2="600" y2="220" stroke="#eab308" stroke-width="6"/>

  <!-- Arena Spotlights -->
  <polygon points="120,0 200,320 60,320" fill="#fff" opacity="0.08"/>
  <polygon points="480,0 540,320 400,320" fill="#fff" opacity="0.08"/>

  <!-- Little Mac Green Gloves Silhouette vs Opponent Red Giant -->
  <!-- Opponent Glass Joe / Bald Bull silhouette -->
  <g fill="#991b1b" stroke="#f87171" stroke-width="2">
    <!-- Big Head and shoulders -->
    <circle cx="300" cy="120" r="45"/>
    <!-- Fierce brow -->
    <path d="M275 110 L300 120 L325 110" stroke="#000" stroke-width="4" fill="none"/>
    <!-- Huge Torso -->
    <path d="M230 160 Q300 130 370 160 L380 270 Q300 290 220 270 Z"/>
    <!-- Big boxing gloves raised -->
    <circle cx="210" cy="180" r="34" fill="#dc2626"/>
    <circle cx="390" cy="180" r="34" fill="#dc2626"/>
  </g>

  <!-- Impact Hit Spark in Center -->
  <g filter="url(#punch-glow)">
    <polygon points="300,180 320,165 315,190 340,195 315,205 320,230 300,215 280,230 285,205 260,195 285,190 280,165" fill="#facc15"/>
    <circle cx="300" cy="195" r="14" fill="#fff"/>
  </g>

  <!-- Little Mac (from behind) with bright green gloves -->
  <g fill="#166534" stroke="#22c55e" stroke-width="3">
    <!-- Black hair -->
    <path d="M280 270 Q300 240 320 270 Z" fill="#1e293b"/>
    <!-- Shoulders -->
    <path d="M260 290 Q300 270 340 290 L345 350 L255 350 Z"/>
    <!-- Green Glove Punching Up -->
    <circle cx="300" cy="235" r="28" fill="#22c55e" filter="url(#punch-glow)"/>
  </g>

  <!-- KO Badge -->
  <rect x="230" y="30" width="140" height="42" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" filter="url(#punch-glow)"/>
  <text x="300" y="60" fill="#fff" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="3" text-anchor="middle">K.O. !!</text>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#140212" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#punch-glow)">SUPER NOCAUTE (PUNCH-OUT)</text>
</svg>
