<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1912"/>
      <stop offset="50%" stop-color="#142e20"/>
      <stop offset="100%" stop-color="#1e0b36"/>
    </linearGradient>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#snake-bg)"/>

  <!-- Matrix LCD grid effect -->
  <g stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.15">
    <line x1="50" y1="40" x2="550" y2="40"/>
    <line x1="50" y1="80" x2="550" y2="80"/>
    <line x1="50" y1="120" x2="550" y2="120"/>
    <line x1="50" y1="160" x2="550" y2="160"/>
    <line x1="50" y1="200" x2="550" y2="200"/>
    <line x1="50" y1="240" x2="550" y2="240"/>
    <line x1="50" y1="280" x2="550" y2="280"/>
    <line x1="50" y1="320" x2="550" y2="320"/>
    <line x1="50" y1="360" x2="550" y2="360"/>
  </g>

  <!-- Glowing Snake Segments -->
  <g fill="#22c55e" filter="url(#green-glow)">
    <!-- Snake body moving in loop -->
    <rect x="80" y="240" width="34" height="34" rx="6"/>
    <rect x="120" y="240" width="34" height="34" rx="6"/>
    <rect x="160" y="240" width="34" height="34" rx="6"/>
    <rect x="200" y="240" width="34" height="34" rx="6"/>
    <rect x="240" y="240" width="34" height="34" rx="6"/>
    <rect x="240" y="200" width="34" height="34" rx="6"/>
    <rect x="240" y="160" width="34" height="34" rx="6"/>
    <rect x="240" y="120" width="34" height="34" rx="6"/>
    <rect x="280" y="120" width="34" height="34" rx="6"/>
    <rect x="320" y="120" width="34" height="34" rx="6"/>
    <rect x="360" y="120" width="34" height="34" rx="6"/>
    <rect x="360" y="160" width="34" height="34" rx="6"/>
    <rect x="360" y="200" width="34" height="34" rx="6"/>
    <rect x="400" y="200" width="34" height="34" rx="6"/>
    <!-- Head with neon eyes -->
    <rect x="440" y="200" width="38" height="34" rx="8" fill="#4ade80"/>
    <circle cx="462" cy="208" r="4" fill="#000"/>
    <circle cx="462" cy="226" r="4" fill="#000"/>
    <circle cx="464" cy="208" r="1.5" fill="#fff"/>
    <circle cx="464" cy="226" r="1.5" fill="#fff"/>
  </g>

  <!-- Glowing Red Apples -->
  <g filter="url(#green-glow)">
    <circle cx="510" cy="217" r="14" fill="#ef4444"/>
    <path d="M510 203 Q514 195 518 196" stroke="#22c55e" stroke-width="2.5" fill="none"/>
    <circle cx="506" cy="213" r="3" fill="#fca5a5"/>

    <circle cx="160" cy="140" r="14" fill="#eab308"/>
    <path d="M160 126 Q164 118 168 119" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0a140f" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#green-glow)">COBRINHA CLÁSSICA</text>
</svg>
