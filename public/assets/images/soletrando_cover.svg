<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0933"/>
      <stop offset="50%" stop-color="#3d1406"/>
      <stop offset="100%" stop-color="#140624"/>
    </linearGradient>
    <linearGradient id="gold-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#gold-bg)"/>

  <!-- TV Studio Arch & Lights -->
  <path d="M50 350 C100 50 500 50 550 350" fill="none" stroke="#ca8a04" stroke-width="4" stroke-dasharray="10,12"/>

  <!-- Golden 1 Milhão Crown / Silvio Badge -->
  <g filter="url(#gold-glow)">
    <circle cx="300" cy="100" r="45" fill="#eab308" stroke="#fef08a" stroke-width="3"/>
    <text x="300" y="95" fill="#713f12" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">SHOW DO</text>
    <text x="300" y="115" fill="#713f12" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">1 MILHÃO</text>
  </g>

  <!-- Letter Tiles Display (Wheel of Fortune / Show do Milhão style) -->
  <g transform="translate(60, 160)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="60" height="70" rx="8" fill="#1e1b4b" stroke="#00f5ff" stroke-width="3"/>
    <text x="30" y="48" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">S</text>
    <!-- Tile 2 -->
    <rect x="70" y="0" width="60" height="70" rx="8" fill="#1e1b4b" stroke="#00f5ff" stroke-width="3"/>
    <text x="100" y="48" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">I</text>
    <!-- Tile 3 -->
    <rect x="140" y="0" width="60" height="70" rx="8" fill="#1e1b4b" stroke="#00f5ff" stroke-width="3"/>
    <text x="170" y="48" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">L</text>
    <!-- Tile 4 -->
    <rect x="210" y="0" width="60" height="70" rx="8" fill="#1e1b4b" stroke="#00f5ff" stroke-width="3"/>
    <text x="240" y="48" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">V</text>
    <!-- Tile 5 -->
    <rect x="280" y="0" width="60" height="70" rx="8" fill="#1e1b4b" stroke="#00f5ff" stroke-width="3"/>
    <text x="310" y="48" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">I</text>
    <!-- Tile 6 (Secret) -->
    <rect x="350" y="0" width="60" height="70" rx="8" fill="#facc15" stroke="#fff" stroke-width="3" filter="url(#gold-glow)"/>
    <text x="380" y="48" fill="#713f12" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">O</text>
    <!-- Tile 7 -->
    <rect x="420" y="0" width="60" height="70" rx="8" fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
    <text x="450" y="48" fill="#eab308" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">?</text>
  </g>

  <!-- Gold Bars at the bottom -->
  <g transform="translate(180, 270)" filter="url(#gold-glow)">
    <!-- Gold bar 1 -->
    <polygon points="20,30 200,30 180,50 0,50" fill="url(#gold-bar)"/>
    <!-- Gold bar 2 -->
    <polygon points="50,10 230,10 210,30 30,30" fill="url(#gold-bar)"/>
    <text x="120" y="45" fill="#713f12" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">BARRAS DE OURO</text>
  </g>

  <!-- Title marquee -->
  <rect x="0" y="375" width="600" height="75" fill="#0e0419" fill-opacity="0.95"/>
  <text x="300" y="422" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#gold-glow)">SHOW DO SOLETRANDO</text>
</svg>
