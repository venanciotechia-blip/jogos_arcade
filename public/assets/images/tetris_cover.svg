<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="tetris-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tetris-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="tetris-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="tetris-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tetris-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6b21a8" stroke-width="0.8" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#grid)"/>

  <!-- Matrix outline in center -->
  <rect x="180" y="40" width="240" height="370" rx="10" fill="#120624" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.4" filter="url(#neon-glow)"/>

  <!-- Ghost matrix grid lines -->
  <line x1="240" y1="40" x2="240" y2="410" stroke="#4c1d95" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="300" y1="40" x2="300" y2="410" stroke="#4c1d95" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="360" y1="40" x2="360" y2="410" stroke="#4c1d95" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Stacked Tetrominoes -->
  <!-- Line 1 bottom -->
  <rect x="190" y="370" width="36" height="36" rx="4" fill="url(#tetris-blue)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="228" y="370" width="36" height="36" rx="4" fill="url(#tetris-blue)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="266" y="370" width="36" height="36" rx="4" fill="url(#tetris-yellow)" stroke="#fef08a" stroke-width="2"/>
  <rect x="304" y="370" width="36" height="36" rx="4" fill="url(#tetris-yellow)" stroke="#fef08a" stroke-width="2"/>
  <rect x="342" y="370" width="36" height="36" rx="4" fill="url(#tetris-orange)" stroke="#fdba74" stroke-width="2"/>
  <rect x="380" y="370" width="36" height="36" rx="4" fill="url(#tetris-orange)" stroke="#fdba74" stroke-width="2"/>

  <!-- Line 2 -->
  <rect x="266" y="332" width="36" height="36" rx="4" fill="url(#tetris-yellow)" stroke="#fef08a" stroke-width="2"/>
  <rect x="304" y="332" width="36" height="36" rx="4" fill="url(#tetris-yellow)" stroke="#fef08a" stroke-width="2"/>
  <rect x="342" y="332" width="36" height="36" rx="4" fill="url(#tetris-orange)" stroke="#fdba74" stroke-width="2"/>
  <rect x="380" y="294" width="36" height="36" rx="4" fill="url(#tetris-orange)" stroke="#fdba74" stroke-width="2"/>

  <!-- T-piece in purple -->
  <rect x="228" y="294" width="36" height="36" rx="4" fill="url(#tetris-purple)" stroke="#f0abfc" stroke-width="2"/>
  <rect x="266" y="294" width="36" height="36" rx="4" fill="url(#tetris-purple)" stroke="#f0abfc" stroke-width="2"/>
  <rect x="304" y="294" width="36" height="36" rx="4" fill="url(#tetris-purple)" stroke="#f0abfc" stroke-width="2"/>
  <rect x="266" y="256" width="36" height="36" rx="4" fill="url(#tetris-purple)" stroke="#f0abfc" stroke-width="2"/>

  <!-- Falling I-piece in Cyan (neon) with speed trail -->
  <g filter="url(#neon-glow)">
    <rect x="266" y="90" width="36" height="36" rx="4" fill="#00f5ff" stroke="#e0f2fe" stroke-width="2"/>
    <rect x="266" y="128" width="36" height="36" rx="4" fill="#00f5ff" stroke="#e0f2fe" stroke-width="2"/>
    <rect x="266" y="166" width="36" height="36" rx="4" fill="#00f5ff" stroke="#e0f2fe" stroke-width="2"/>
    <rect x="266" y="204" width="36" height="36" rx="4" fill="#00f5ff" stroke="#e0f2fe" stroke-width="2"/>
  </g>

  <!-- Left side Retro decorative badges -->
  <rect x="25" y="60" width="130" height="90" rx="10" fill="#200d3b" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="90" y="90" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LINHAS</text>
  <text x="90" y="125" fill="#00f5ff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle" filter="url(#neon-glow)">042</text>

  <rect x="25" y="170" width="130" height="90" rx="10" fill="#200d3b" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="90" y="200" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">NÍVEL</text>
  <text x="90" y="235" fill="#facc15" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">09</text>

  <!-- Right side Next Piece -->
  <rect x="445" y="60" width="130" height="130" rx="10" fill="#200d3b" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="510" y="90" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PRÓXIMA</text>
  <rect x="480" y="115" width="25" height="25" rx="3" fill="url(#tetris-green)" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="505" y="115" width="25" height="25" rx="3" fill="url(#tetris-green)" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="505" y="140" width="25" height="25" rx="3" fill="url(#tetris-green)" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="530" y="140" width="25" height="25" rx="3" fill="url(#tetris-green)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Big Title Marquee at the bottom -->
  <rect x="0" y="380" width="600" height="70" fill="#0f051d" fill-opacity="0.95"/>
  <text x="300" y="425" fill="#00f5ff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#neon-glow)">BLOCOS RETRÔ (TETRIS)</text>
</svg>
